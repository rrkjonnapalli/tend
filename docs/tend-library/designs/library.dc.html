<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tend.css">
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="words.css">
<link rel="stylesheet" href="snaps.css">
<link rel="stylesheet" href="refs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Lato:wght@400;700&amp;family=Montserrat:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="app lib-app" style="font-family: 'Lato', sans-serif; color: #303841; position: relative;">
  <div class="libbar">
    <div class="seg" role="tablist" aria-label="Library">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button class="{{ t.cls }}" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}">{{ t.label }}</button>
      </sc-for>
    </div>
    <button class="icon-btn plus" aria-label="Add to the library" title="Add to the library" onClick="{{ openAdd }}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <label class="lsearch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input type="search" aria-label="{{ searchLabel }}" placeholder="{{ searchLabel }}" value="{{ query }}" onChange="{{ onQuery }}" onKeyDown="{{ onQueryKey }}">
      <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}"><button class="x" aria-label="Clear search" onClick="{{ clearQuery }}"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke: currentColor;"><path d="M7 7l10 10M17 7L7 17"/></svg></button></sc-if>
    </label>
  </div>

  <div class="body" style="flex-direction: column;">
    <!-- HOME -->
    <sc-if value="{{ showHome }}" hint-placeholder-val="{{ true }}">
      <div class="view"><div class="scroll">
        <div class="home">
          <div>
            <h1 class="title">Library</h1>
            <span class="caption">{{ counts }}</span>
          </div>
          <div class="cols">
            <section class="col">
              <div class="col-head"><h2>Words</h2><span class="meta">recent</span><button class="more" onClick="{{ goWords }}">All →</button></div>
              <sc-for list="{{ homeWords }}" as="w" hint-placeholder-count="5">
                <button class="item" onClick="{{ w.go }}"><b>{{ w.word }}</b><span>{{ w.mine }}</span></button>
              </sc-for>
            </section>
            <section class="col">
              <div class="col-head"><h2>Snaps</h2><span class="meta">latest</span><button class="more" onClick="{{ goSnaps }}">Board →</button></div>
              <div class="mini">
                <sc-for list="{{ homeSnaps }}" as="p" hint-placeholder-count="4">
                  <button class="{{ p.cls }}" style="{{ p.style }}" onClick="{{ goSnaps }}"><span class="pin"></span><span class="t">{{ p.text }}</span></button>
                </sc-for>
              </div>
            </section>
            <section class="col">
              <div class="col-head"><h2>References</h2><span class="meta">new</span><button class="more" onClick="{{ goRefs }}">All →</button></div>
              <sc-for list="{{ homeRefs }}" as="r" hint-placeholder-count="5">
                <button class="item" onClick="{{ goRefs }}"><b class="plain">{{ r.title }}</b><span class="{{ r.refCls }}">{{ r.ref }}</span></button>
              </sc-for>
            </section>
          </div>
        </div>
      </div></div>
    </sc-if>

    <!-- HOME + SEARCH: everything that matches, grouped -->
    <sc-if value="{{ showResults }}" hint-placeholder-val="{{ false }}">
      <div class="view"><div class="scroll">
        <div class="results">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
            <section class="rgroup">
              <h2>{{ g.label }}<span>{{ g.count }}</span></h2>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
                <button class="item" onClick="{{ it.go }}"><b class="{{ it.titleCls }}">{{ it.title }}</b><span class="{{ it.subCls }}">{{ it.sub }}</span></button>
              </sc-for>
            </section>
          </sc-for>
          <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div class="empty-note">Nothing in the library matches “{{ query }}”.</div></sc-if>
        </div>
      </div></div>
    </sc-if>

    <!-- the three areas, exactly as designed; the Library bar replaces their own nav, search and + -->
    <sc-if value="{{ isWords }}" hint-placeholder-val="{{ false }}">
      <dc-import name="words" embedded="{{ true }}" query="{{ query }}" add-request="{{ wordsAdd }}" on-add-taken="{{ addTaken }}" hint-size="1280px,700px"></dc-import>
    </sc-if>
    <sc-if value="{{ isSnaps }}" hint-placeholder-val="{{ false }}">
      <dc-import name="snaps" embedded="{{ true }}" query="{{ query }}" add-request="{{ snapsAdd }}" on-add-taken="{{ addTaken }}" hint-size="1280px,700px"></dc-import>
    </sc-if>
    <sc-if value="{{ isRefs }}" hint-placeholder-val="{{ false }}">
      <dc-import name="references" embedded="{{ true }}" query="{{ query }}" add-request="{{ refsAdd }}" on-add-taken="{{ addTaken }}" hint-size="1280px,700px"></dc-import>
    </sc-if>
  </div>

  <sc-if value="{{ adding }}" hint-placeholder-val="{{ false }}">
    <div class="veil" onMouseDown="{{ closeAdd }}">
      <div class="card" role="dialog" aria-label="Add to the library" onMouseDown="{{ stop }}">
        <textarea class="cap" aria-label="What did you come across" placeholder="Paste a link, type a word, or write a snap…" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" ref="{{ capRef }}"></textarea>
        <div class="dest">
          <span class="lbl">Save to</span>
          <div class="seg sm" role="radiogroup" aria-label="Save to">
            <sc-for list="{{ dests }}" as="d" hint-placeholder-count="3">
              <button class="{{ d.cls }}" role="radio" aria-checked="{{ d.selected }}" onClick="{{ d.pick }}">{{ d.label }}</button>
            </sc-for>
          </div>
          <span class="why">{{ guessWhy }}</span>
        </div>
        <div class="cfoot">
          <span class="hint">{{ handHint }}</span>
          <button class="btn-ghost" onClick="{{ closeAdd }}">Cancel</button>
          <button class="btn-primary" onClick="{{ save }}" disabled="{{ cantSave }}">Continue</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div class="toast" role="status">{{ toast }}</div></sc-if>

  <nav class="nav" aria-label="Main">
    <span></span>
    <div class="tabs">
      <button class="tab" aria-label="Notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg></button>
      <button class="tab" aria-label="Tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
      <button class="tab" aria-label="People"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      <button class="tab on" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5z"/><path d="M10 4h3v16h-3z"/><path d="M15.4 5.2l2.9-.8 3.6 15-2.9.8z"/></svg></button>
    </div>
    <div class="right">
      <button class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      <button class="icon-btn" aria-label="Feedback"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4"/></svg></button>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["home","words","snaps","refs"],"default":"home"},"$preview":{"width":1280,"height":800}}'>
// Library: one bottom-nav tab.
// Top bar: Home · Words · Snaps · References, a search, and one Add.
// Home shows recent words, the latest snaps and new references; search there looks through everything.
// Words, Snaps and References are the real designs, mounted as they are.
// + inside an area opens that area's own add. + on Home asks what it is, then opens that area's add with it filled in.
const WORDS = [
  { word: 'ephemeral', kind: 'word', ipa: '/ɪˈfɛm(ə)ɹəl/', def: 'Lasting for a very short time.', mine: 'Here and then gone, like a mood or a trend.' },
  { word: 'Chesterton’s fence', kind: 'term', ipa: '', def: '(no dictionary entry)', mine: 'Don’t remove a rule until you know why it’s there.' },
  { word: 'laconic', kind: 'word', ipa: '/ləˈkɒnɪk/', def: 'Using very few words.', mine: 'Says a lot with almost nothing.' },
  { word: 'petrichor', kind: 'word', ipa: '/ˈpɛtɹɪkɔː/', def: 'A pleasant smell that comes with the first rain after dry weather.', mine: 'The smell of rain on dry ground.' },
  { word: 'bite the bullet', kind: 'idiom', ipa: '', def: 'To do something difficult you have been putting off.', mine: 'Stop delaying the hard thing and do it.' },
  { word: 'sanguine', kind: 'word', ipa: '/ˈsæŋɡwɪn/', def: 'Optimistic, especially in a difficult situation.', mine: 'Calmly hopeful when others are not.' },
];
const SNAPS = [
  { kind: 'scrap', text: 'write it down before\nit becomes a feeling', date: 'Today', tag: '#thought' },
  { kind: 'sticky', text: 'late train —\nthe window holds\na second, quieter city', date: 'Thu', tag: '#poem' },
  { kind: 'slip', text: 'Measure twice, ship once, then measure again.', date: '18 Aug', tag: '#work' },
  { kind: 'lined', text: 'The first cold morning.\nEveryone on the street\nwalking a little faster\nas if late for winter.', date: '28 Sep', tag: '#poem' },
  { kind: 'scrap', text: 'the kettle clicks off\nbefore I remember\nwhy I stood up', date: '14 Sep', tag: '#poem +1' },
  { kind: 'sticky2', text: 'A good name is one you never have to explain twice.', date: '9 Sep', tag: '#thought' },
];
const PAPER = {
  lined: 'background-color:#fffdf8;background-image:linear-gradient(90deg,transparent 33px,#efb4b4 33px,#efb4b4 34px,transparent 34px),repeating-linear-gradient(transparent 0 23px,#d6e3f0 23px 24px);background-position:0 0,0 4px;padding-left:44px;',
  sticky: 'background:linear-gradient(hsl(47 64% 79%) 0 14px,hsl(47 64% 87%) 14px);min-height:200px;',
  sticky2: 'background:linear-gradient(hsl(148 51% 79%) 0 14px,hsl(148 51% 87%) 14px);min-height:200px;',
  scrap: 'background:#fffdf8;',
  slip: 'background:#efe3c8;',
};
const MINI_PAPER = {
  lined: 'background:#fffdf8;', sticky: 'background:linear-gradient(hsl(47 64% 79%) 0 12px,hsl(47 64% 87%) 12px);',
  sticky2: 'background:linear-gradient(hsl(148 51% 79%) 0 12px,hsl(148 51% 87%) 12px);', scrap: 'background:#fffdf8;', slip: 'background:#efe3c8;',
};
const MINI_SPOTS = [[22, 24, -2], [192, 30, 2.5], [56, 158, 1.5], [218, 170, -1.5]];
const TILT = [-1.6, 1.2, -0.6, 1.8, -1.2, 0.6];
const REFS = [
  { title: 'What are runes?', ref: 'svelte.dev/blog/runes', link: true, why: '$state, $derived, $effect in one page.', tags: ['tend'], added: 'today' },
  { title: 'Simple Made Easy, Rich Hickey', ref: 'youtube.com/watch?v=rx7mpbt7vlo', link: true, why: '', tags: [], added: 'Wed' },
  { title: 'How to Do Great Work', ref: 'paulgraham.com/greatwork.html', link: true, why: 'The part on curiosity.', tags: ['essay'], added: 'Tue' },
  { title: 'Perfect Days', ref: 'Perfect Days', link: false, why: 'Someone said it is the calmest film they know.', tags: ['watch'], added: 'Mon' },
  { title: 'Butterick’s Practical Typography', ref: 'practicaltypography.com', link: true, why: 'Line length.', tags: ['design'], added: '2 Oct' },
  { title: 'The Remains of the Day', ref: 'The Remains of the Day', link: false, why: 'Where “ephemeral” came from.', tags: ['reading'], added: '20 Sep' },
];
const AREAS = [
  { id: 'home', label: 'Home' },
  { id: 'words', label: 'Words', one: 'word' },
  { id: 'snaps', label: 'Snaps', one: 'snap' },
  { id: 'refs', label: 'References', one: 'reference' },
];

function isUrl(v) {
  const t = v.trim();
  return /^https?:\/\/\S+$/i.test(t) || /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(t);
}
// where a thing probably belongs
function guess(v) {
  const t = v.trim();
  if (!t) return null;
  if (isUrl(t)) return { to: 'refs', why: 'It’s a link.' };
  if (!/\n/.test(t) && t.split(/\s+/).length <= 4 && t.length <= 40) return { to: 'words', why: 'Short, so probably a word or phrase.' };
  return { to: 'snaps', why: 'Reads like something you wrote.' };
}
const has = (text, q) => text.toLowerCase().indexOf(q) > -1;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.capRef = (el) => { if (el && this.wantFocus) { this.wantFocus = false; el.focus(); } };
    this.state = { area: props.start || 'home', query: '', picked: 0, adding: false, draft: '', pick: null, toast: '', request: null, n: 0 };
  }

  componentWillUnmount() { clearTimeout(this.t); }

  go(area) { this.setState({ area, query: '' }); }

  // + : on Home, ask what it is; inside an area, open that area's own add
  openAdd() {
    const s = this.state;
    if (s.area === 'home') { this.wantFocus = true; this.setState({ adding: true, draft: '', pick: null }); return; }
    this.setState({ request: { area: s.area, n: s.n + 1, text: '' }, n: s.n + 1 });
  }

  save() {
    const s = this.state;
    const g = guess(s.draft);
    if (!g) return;
    const to = s.pick || g.to;
    this.setState({ adding: false, area: to, query: '', request: { area: to, n: s.n + 1, text: s.draft.trim() }, n: s.n + 1 });
  }

  renderVals() {
    const s = this.state;
    const q = s.query.trim().toLowerCase();
    const g = guess(s.draft);
    const to = s.pick || (g && g.to) || null;
    const areaLabel = (AREAS.find((a) => a.id === s.area) || AREAS[0]).label;

    const wordsHit = WORDS.map((w, i) => ({ ...w, i })).filter((w) => !q || has(w.word + ' ' + w.mine, q));
    const snapsHit = SNAPS.filter((p) => !q || has(p.text, q));
    const refsHit = REFS.filter((r) => !q || has(r.title + ' ' + r.ref + ' ' + r.why, q));

    // search on Home looks through everything, grouped
    const groups = [
      { label: 'Words', area: 'words', items: wordsHit.map((w) => ({ title: w.word, sub: w.mine, titleCls: '', subCls: '', go: () => this.setState({ area: 'words', picked: w.i }) })) },
      { label: 'Snaps', area: 'snaps', items: snapsHit.map((p) => ({ title: p.text.split('\n')[0], sub: p.tag + ' · ' + p.date, titleCls: 'plain', subCls: '', go: () => this.go('snaps') })) },
      { label: 'References', area: 'refs', items: refsHit.map((r) => ({ title: r.title, sub: r.ref, titleCls: 'plain', subCls: r.link ? 'u' : '', go: () => this.go('refs') })) },
    ].filter((x) => x.items.length).map((x) => ({ ...x, count: String(x.items.length) }));

    return {
      tabs: AREAS.map((a) => ({
        label: a.label, cls: a.id === s.area ? 'on' : '', selected: a.id === s.area ? 'true' : 'false',
        pick: () => this.go(a.id),
      })),
      searchLabel: s.area === 'home' ? 'Search the library' : 'Search ' + areaLabel.toLowerCase(),
      query: s.query,
      hasQuery: !!s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      onQueryKey: (e) => { if (e.key === 'Escape') { e.preventDefault(); this.setState({ query: '' }); } },
      clearQuery: () => this.setState({ query: '' }),

      showHome: s.area === 'home' && !q,
      showResults: s.area === 'home' && !!q,
      isWords: s.area === 'words', isSnaps: s.area === 'snaps', isRefs: s.area === 'refs',
      counts: WORDS.length + ' words · ' + SNAPS.length + ' snaps · ' + REFS.length + ' references',
      goWords: () => this.go('words'), goSnaps: () => this.go('snaps'), goRefs: () => this.go('refs'),
      homeWords: WORDS.slice(0, 5).map((w, i) => ({ word: w.word, mine: w.mine, go: () => this.setState({ area: 'words', picked: i }) })),
      homeSnaps: SNAPS.slice(0, 4).map((p, i) => ({
        text: p.text, cls: 'mp' + (p.kind.indexOf('sticky') === 0 ? ' st' : ''),
        style: MINI_PAPER[p.kind] + 'left: ' + MINI_SPOTS[i][0] + 'px; top: ' + MINI_SPOTS[i][1] + 'px; transform: rotate(' + MINI_SPOTS[i][2] + 'deg);',
      })),
      homeRefs: REFS.slice(0, 5).map((r) => ({ title: r.title, ref: r.link ? r.ref : 'text', refCls: r.link ? 'u' : '' })),
      groups,
      noResults: groups.length === 0,


      adding: s.adding,
      draft: s.draft,
      capRef: this.capRef,
      openAdd: () => this.openAdd(),
      closeAdd: () => this.setState({ adding: false }),
      stop: (e) => e.stopPropagation(),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.save(); }
        if (e.key === 'Escape') { e.preventDefault(); this.setState({ adding: false }); }
      },
      dests: AREAS.filter((a) => a.one).map((a) => ({
        label: a.one, cls: a.id === to ? 'on' : '', selected: a.id === to ? 'true' : 'false',
        pick: () => this.setState({ pick: a.id }),
      })),
      guessWhy: s.pick ? '' : (g ? g.why : 'It picks for you as you type.'),
      cantSave: !g,
      handHint: to ? '\u21b5 continues in ' + AREAS.find((a) => a.id === to).label + ', with this filled in' : '\u21b5 continues where it belongs',
      wordsAdd: s.request && s.request.area === 'words' ? s.request : null,
      snapsAdd: s.request && s.request.area === 'snaps' ? s.request : null,
      refsAdd: s.request && s.request.area === 'refs' ? s.request : null,
      addTaken: () => this.setState({ request: null }),
      save: () => this.save(),
      hasToast: !!s.toast,
      toast: s.toast,
    };
  }
}
</script>
</body>
</html>
