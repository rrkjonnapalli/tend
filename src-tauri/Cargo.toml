[package]
name = "tend"
version = "0.1.0"
description = "Notes, tasks and people"
authors = ["sage"]
edition = "2021"
rust-version = "1.95"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "tend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ulid = "3.0.0"
ureq = "3.4.2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
sha2 = "0.11.0"
mime_guess = "2.0.5"
unicode-normalization = "0.1.25"
rusqlite_migration = "2.6.0"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
keyring-core = "1.0.0"
trash = "5.2.9"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6.4"

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.12.1", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Desktop only: the window size and position are remembered between launches, and the app runs
# once (a second launch brings the window forward).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
