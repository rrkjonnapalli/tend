[package]
name = "tend"
version = "0.1.0"
description = "Notes, tasks and people"
authors = ["sage"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "tend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ulid = "3.0.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
mime_guess = "2.0.5"

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.12.1", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
